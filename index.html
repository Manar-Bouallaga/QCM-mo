var app=document.getElementById('app'),S;
var esc=function(t){return t.replace(/</g,'&lt;')};
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function home(){
  var secs=[],i;for(i=0;i<Q.length;i++)if(secs.indexOf(Q[i][4])<0)secs.push(Q[i][4]);
  app.innerHTML='<div class="card"><h1>QCM – مباراة ضباط الشرطة</h1><p class="mu">'+Q.length+' سؤالا، لكل سؤال 4 اختيارات. التنقيط: +1 للجواب الصحيح، −0.25 للخاطئ، 0 عند التخطي. المراجع القانونية تظهر بعد كل جواب.</p>'+
  '<div class="row" id="sec"></div><p><button class="p" id="all">ابدأ الكل (ترتيب عشوائي)</button></p></div>';
  var box=document.getElementById('sec');
  secs.forEach(function(s){var b=document.createElement('button');b.textContent=s;b.onclick=function(){start(s)};box.appendChild(b)});
  document.getElementById('all').onclick=function(){start()};
}
function start(sec){
  var qs=Q.filter(function(q){return !sec||q[4]===sec});
  S={qs:shuf(qs),i:0,score:0,ok:0,ko:0,sk:0,done:false,wrong:[]};show();
}
function show(){
  if(S.i>=S.qs.length)return end();
  var q=S.qs[S.i];S.done=false;
  var order=shuf([0,1,2,3]);S.order=order;
  var h='<div class="bar"><i style="width:'+(S.i/S.qs.length*100)+'%"></i></div><div class="card"><div class="row mu"><span>'+(S.i+1)+' / '+S.qs.length+'</span><span>'+q[4]+'</span></div><h1 style="margin-top:10px">'+esc(q[0])+'</h1>';
  order.forEach(function(k,p){h+='<button class="opt" data-k="'+k+'">'+esc(q[1][k])+'</button>'});
  h+='<div id="fb"></div><div class="row" style="margin-top:10px"><button id="skip">تخطي</button><button class="p" id="next" style="display:none">التالي</button></div></div>';
  app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){pick(+b.dataset.k)}});
  document.getElementById('skip').onclick=function(){if(S.done)return;S.sk++;S.wrong.push(q);reveal(-1)};
  document.getElementById('next').onclick=function(){S.i++;show()};
}
function pick(k){
  if(S.done)return;var q=S.qs[S.i];
  if(k===q[2]){S.ok++;S.score+=1}else{S.ko++;S.score-=0.25;S.wrong.push(q)}
  reveal(k);
}
function reveal(k){
  var q=S.qs[S.i];S.done=true;
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){var v=+b.dataset.k;if(v===q[2])b.classList.add('ok');else if(v===k)b.classList.add('ko');b.disabled=true});
  document.getElementById('fb').innerHTML='<p class="mu">'+(k===q[2]?'✔ صحيح':k<0?'تم التخطي':'✘ خطأ')+' — المرجع: '+q[3]+'</p>';
  document.getElementById('skip').style.display='none';
  var n=document.getElementById('next');n.style.display='';n.textContent=S.i+1>=S.qs.length?'النتيجة':'التالي';
}
function end(){
  var h='<div class="card"><h1>النتيجة</h1><div class="big">'+S.score.toFixed(2).replace(/\.?0+$/,'')+' / '+S.qs.length+'</div><p class="mu">صحيح: '+S.ok+' · خطأ: '+S.ko+' · تخطي: '+S.sk+'</p>';
  if(S.wrong.length){h+='<h1 style="font-size:1.05rem">للمراجعة</h1>';S.wrong.forEach(function(q){h+='<p>• '+esc(q[0])+'<br><span class="mu">'+esc(q[1][q[2]])+' ('+q[3]+')</span></p>'})}
  h+='<div class="row"><button class="p" id="re">إعادة</button>'+(S.wrong.length?'<button id="rw">أعد الأخطاء فقط</button>':'')+'</div></div>';
  app.innerHTML=h;
  document.getElementById('re').onclick=home;
  var rw=document.getElementById('rw');if(rw)rw.onclick=function(){var w=S.wrong;S={qs:shuf(w),i:0,score:0,ok:0,ko:0,sk:0,done:false,wrong:[]};show()};
}
home();
</script>
